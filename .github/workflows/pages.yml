# Deploy the static site in web/ to GitHub Pages (preview). Repository settings: Pages -> Source: "GitHub Actions".
name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04            # pinned runner image
    steps:
      - uses: actions/checkout@v7               # Node 24
      - uses: actions/configure-pages@v6        # Node 24
      - uses: actions/upload-pages-artifact@v5  # uses upload-artifact v7 (Node 24); dotfiles excluded (none needed)
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5           # Node 24
